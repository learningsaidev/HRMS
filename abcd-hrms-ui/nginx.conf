server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Angular SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Microservice reverse proxies (Docker Compose internal hostnames)
    location /api/v1/auth/ {
        proxy_pass http://identity-service:8081/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/workforce/ {
        proxy_pass http://workforce-service:8082/api/v1/workforce/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/attendance/ {
        proxy_pass http://time-leave-service:8083/api/v1/attendance/;
