server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: workforce-service
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

abcd:
  security:
    jwt:
      secret: ${ABCD_SECURITY_JWT_SECRET:ABCD-ENTERPRISE-SUPER-SECRET-JWT-SIGNING-KEY-FOR-ABCD-HRMS-PLATFORM-2026-MUST-BE-64-BYTES!}
      expiration-minutes: 120
      issuer: https://auth.abcd-hrms.corp
    encryption-key: ${ABCD_SECURITY_ENCRYPTION_KEY:ABCD-ENTERPRISE-SECRET-KEY-32B!}
  messaging:
    outbox:
      poll-interval-ms: 2000

splunk:
  hec:
    url: ${SPLUNK_HEC_URL:http://localhost:8088/services/collector/event}
    token: ${SPLUNK_HEC_TOKEN:946654e2-6e83-4ae2-943a-a32ffef9305b}
    index: ${SPLUNK_INDEX:main}
    enabled: ${SPLUNK_ENABLED:true}
