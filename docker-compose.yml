version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: abcd-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abcd_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abcd_secret_2026}
      POSTGRES_MULTIPLE_DATABASES: abcd_identity,abcd_workforce,abcd_time_leave,abcd_onboarding,abcd_payroll,abcd_tax_benefits,abcd_payment_ledger,abcd_notification_reporting
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abcd_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - abcd-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: abcd-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - abcd-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: abcd-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - abcd-network

  redis:
    image: redis:7-alpine
    container_name: abcd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - abcd-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: abcd-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - abcd-network

volumes:
  postgres-data:
  redis-data:

networks:
  abcd-network:
    driver: bridge
